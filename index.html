  <script>
    // Sobre las fotos la firma es blanca; al pasar por una zona clara (el marco blanco
    // de la foto sola) se pone oscura. Vigila la franja inferior
    // de la pantalla, que es donde está la firma.
    var firma = document.querySelector('.firma-grande');
    var claras = document.querySelectorAll('.zona-clara');

    // Pulsar la firma estando ya en la portada sube suavemente hasta arriba
    if (firma) {
      firma.addEventListener('click', function (evento) {
        evento.preventDefault();
        window.scrollTo({ top: 0, behavior: 'smooth' });
      });
    }

    if (firma && claras.length && 'IntersectionObserver' in window) {
      var dentro = new Set();
      var vigilante = new IntersectionObserver(function (entradas) {
        entradas.forEach(function (e) {
          if (e.isIntersecting) { dentro.add(e.target); } else { dentro.delete(e.target); }
        });
        firma.classList.toggle('firma-oscura', dentro.size > 0);
      }, { rootMargin: '-65% 0px 0px 0px' });
      claras.forEach(function (zona) { vigilante.observe(zona); });
    }
  </script>
