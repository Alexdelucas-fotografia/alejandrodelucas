    // Para cambiar la foto, cambia esta ruta (la ruta de la foto, dentro de fotos/web/Familia/).
    window.introFoto = 'fotos/web/Familia/Sesi\u00f3n 3/Sesi\u00f3n 3 Familia y RN autor (22).jpg';
    try {
      var forzar = /[?&]intro(=|&|$)/.test(location.search);   // abrir la portada con ?intro (por ejemplo http://localhost:8080/?intro) fuerza que salga la intro
      if ((forzar || !sessionStorage.getItem('intro-vista')) && !window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
        document.documentElement.classList.add('con-intro');
        new Image().src = encodeURI(window.introFoto);   // empieza a cargarla ya
      }
    } catch (e) {}
  </script>
